# ---------------------------------------------------------------------------
# Naukri auto-apply agent.
#
# TWO ACCOUNTS, TWO RESUMES:
#   primary   (NAUKRI_EMAIL)   -> AI / Python Engineer resume
#   secondary (NAUKRI_EMAIL_2) -> Full Stack / MERN + AI resume
#
# Naukri attaches whatever resume sits on the PROFILE — there is no per-
# application resume picker — so one account == one resume == one job family.
# Each profile below is bound to its account with `account:`, and a run only
# ever touches one account (`run -a primary`, `run --all-accounts` for both,
# sequentially).
#
# SOURCE: Naukri's own "Recommended jobs" feed only. Naukri has already matched
# those postings against the profile, headline, skills and preferences, so it
# beats any keyword query. There is no keyword-search path in this product.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Identity is defined ONCE in the `candidate:` block near the bottom of this
# file. At load time it is mirrored into the legacy `applicant_name`,
# `applicant_email`, `applicant_phone` and `applicant_location` fields, so you
# only need to edit `candidate:` when the candidate's details change.
# Only the profile links (not part of `candidate:`) are set here.
# ---------------------------------------------------------------------------

applicant_linkedin: "https://www.linkedin.com/in/maheshchitakoti"
applicant_github: "https://github.com/maheshchichkoti"
applicant_portfolio: "https://github.com/maheshchichkoti"

platforms:
  instahyre: true
  cutshort: true
  linkedin: true
  naukri: true
  wellfound: true
  # HiringCafe PAUSED (2026-10-14, runs 561-563 prove it): wall broken and
  # collection fixed, but the 3-day feed serves EXPIRED postings (Accenture,
  # Ford, Mercedes detail pages all "Expired Job") with no ATS links — zero
  # jobs can reach Sidekick. Auto-retried on cooldown by the pause logic;
  # unpause only when the feed serves live postings again.
  hiringcafe: false

# HiringCafe feed (read-only source for the Sidekick handoff).
# Server-side filters mirror the proven query: fresh, junior, eng/IT/data.
# NOTE: HiringCafe is EXTERNAL-only (never APPLIED), so it takes no
# platform_limits entry — volume is governed by target_jobs_per_run below.
hiringcafe:
  max_days: 3
  max_experience: 3
  target_jobs_per_run: 25
  max_pages: 6

# Sidekick handoff (contract v1, see career-apply-agent/CONTRACT.md +
# SIDEKICK_PICKUP.md). External outcomes from ANY platform are enqueued in
# Postgres; mode "pickup" (below) means Sidekick drains the outbox itself
# whenever IT runs — no POSTs from here, no schedule choreography, no
# undispatched warnings. "push" restores agent-side POST-at-flush.
sidekick_integration:
  enabled: true
  mode: pickup
  api_url: "http://127.0.0.1:8000"
  auto_flush_on_startup: true
  request_timeout_s: 60


linkedin:
  days: 1

instahyre:
  # Feed pages to scrape: skill-filtered search is relevance-ordered (decay,
  # not cliff). Eligible jobs were observed on page 3 itself, so 5 keeps a
  # 2-page margin past the last proven zone at ~25s/page. Ranked-plan CSVs
  # carry per-job page tabs — tighten further only if they prove pages 4-5
  # barren over several runs.
  max_pages: 5
  # Instahyre enforces MAX 15 skill tags: anything past #15 is silently
  # ignored (run 366: 15 active, 16th missing with zero warning). Keep this
  # list at exactly 15, most important first. Code truncates + warns on more.
  skills:
    - "SDET"
    - "Python"
    - "Node.js"
    - "React.js"
    - "TypeScript"
    - "FastAPI"
    - "Next.js"
    - "Generative AI"
    - "JavaScript"
    - "LangChain"
    - "LangGraph"
    - "PostgreSQL"
    - "AWS Bedrock"
    - "API Testing"
    - "Quality Assurance"
  experience_years: 2

browser:
  headless: true
  slow_mo_ms: 0
  viewport_width: 1440
  viewport_height: 900
  locale: en-IN
  timezone: Asia/Kolkata
  default_timeout_ms: 10000        # Fail-fast UI checks (10s)
  navigation_timeout_ms: 20000     # Fail-fast page loads (20s max)
  min_action_delay_ms: 250
  max_action_delay_ms: 800
  # Request interception left the recommended feed on its page shell in headless Chrome.
  block_resources: []
  # Cloudflare experiment: HiringCafe-only clean-room context (real
  # identity, no stealth, no interception). Shared context untouched.
  hiringcafe_clean_context: true

run:
  dedupe_window_days: 90
  daily_application_cap: 80
  max_consecutive_failures: 5
  min_delay_between_applies_s: 8   # Human pacing with room for coffee (8-22s)
  max_delay_between_applies_s: 22  # Human pacing with room for coffee (8-22s)
  max_retries_per_job: 1           # No more double-retries on dead pages
  strict_answers: true
  screenshot_on_failure: true
  screenshot_on_success: false
  run_timeout_minutes: 90          # 90-minute allowance for multi-platform completion

# Naukri's primary feed. Profiles may also opt into experience-filtered Search.
recommended:
  enabled: true
  tabs: ["default", "all"]
  max_scroll_rounds: 20
  stall_rounds_before_stop: 2
  max_jobs: 300
  follow_show_more: true

schedule:
  enabled: true
  # Default, used by any account without an override below.
  cron: "40 9 * * *"
  # The two accounts MUST be hours apart: two logins from one IP inside the same
  # window is the pattern most likely to trigger Naukri's "unusual activity"
  # challenge. Morning for Full-Stack, afternoon for AI/Python.
  cron_by_account:
    primary: "0 9 * * *"     # 09:00 AM IST (Morning recruiter search window - AI)
    secondary: "0 13 * * *"  # 01:00 PM IST (Afternoon recruiter search window - Full Stack)
  timezone: Asia/Kolkata
  jitter_seconds: 600
  run_on_start: false

notifications:
  telegram_enabled: true
  notify_on_success: true
  notify_on_failure: true
  include_job_list: true
  max_jobs_in_message: 15

