  're:describe a react/typescript feature involving api calls|react/typescript feature involving api calls': "At SahioNext, I developed a real-time speech evaluation interface using React, TypeScript, WebSockets, and FastAPI. To manage high-frequency streaming audio and async evaluation states, I built a custom useStreamingEvaluation hook implementing a finite state machine (IDLE | CONNECTING | STREAMING | PROCESSING | ERROR) with client-side audio chunk buffering in an ArrayBuffer queue and exponential backoff reconnection. For REST analytics, I leveraged TanStack Query for caching and optimistic updates, achieving smooth real-time feedback with <100ms UI latency and zero frame drops."
