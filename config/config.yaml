  "describe a complex workflow you simplified. what trade-off did you make, and what informed it?": "In an enterprise document QA system, a naive RAG pipeline ran full-document dense embedding lookups and cross-encoder re-ranking on every query, resulting in 1.8s+ p95 latency and high token costs. I redesigned this into a two-tier hybrid architecture: (1) an exact-match semantic cache (Redis) for recurring queries, and (2) a lightweight BM25 sparse filter before dense retrieval. I traded off the heavyweight cross-encoder re-ranker on high-confidence semantic hits (a minor ~2% recall drop on rare edge cases) to achieve sub-300ms p95 latency and a 35% reduction in LLM token expenditures."
